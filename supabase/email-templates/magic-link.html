<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0;padding:0;background:#0e0c0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0e0c0a;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
            <tr>
              <td align="center" style="padding-bottom:28px;">
                <span style="color:#f5efe6;font-size:15px;font-weight:700;letter-spacing:0.5px;">Sailor VIII Music</span>
              </td>
            </tr>
            <tr>
              <td style="background:#17140f;border:1px solid rgba(245,239,230,0.14);border-radius:16px;padding:32px 28px;">
                <p style="margin:0 0 16px;color:#ff4d1c;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:600;">Sign-in link</p>
                <h1 style="margin:0 0 12px;color:#f5efe6;font-size:22px;line-height:1.3;">Your sign-in link</h1>
                <p style="margin:0 0 28px;color:#a89f8f;font-size:14px;line-height:1.6;">Click the button below to sign in to your Sailor VIII Music account. This link will expire shortly and can only be used once.</p>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#ff4d1c;color:#0e0c0a;text-decoration:none;font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:12px 28px;border-radius:999px;">Sign in</a>
                    </td>
                  </tr>
                </table>

                <p style="margin:24px 0 0;color:#a89f8f;font-size:12px;line-height:1.6;">If you didn't request this, you can safely ignore this email.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:24px;">
                <p style="margin:0;color:#a89f8f;font-size:11px;">Sailor VIII Music</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
